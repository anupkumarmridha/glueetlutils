stages:
  - check
  - build
  - deploy

variables:
  AWS_REGION: "us-east-1"

check_version:
  stage: check
  script:
    - echo "Checking version change..."
    - bash .github/scripts/check_version.sh
  only:
    - main

build_package:
  stage: build
  script:
    - echo "Installing dependencies and building the package..."
    - pip install setuptools wheel boto3
    - bash .github/scripts/build_package.sh
  dependencies:
    - check_version
  artifacts:
    paths:
      - dist/
  only:
    - main

deploy_to_aws_codeartifact:
  stage: deploy
  script:
    - echo "Configuring AWS credentials..."
    - export AWS_ACCESS_KEY_ID=$AWS_ACCESS_KEY_ID
    - export AWS_SECRET_ACCESS_KEY=$AWS_SECRET_ACCESS_KEY
    - export AWS_SESSION_TOKEN=$AWS_SESSION_TOKEN
    - echo "Authenticating to AWS CodeArtifact..."
    - bash .github/scripts/authenticate_codeartifact.sh
    - echo "Uploading package to AWS CodeArtifact..."
    - bash .github/scripts/upload_to_codeartifact.sh
  dependencies:
    - build_package
  only:
    - main
