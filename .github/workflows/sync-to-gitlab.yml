name: Sync to GitLab

on:
  push:
    branches:
      - main

jobs:
  sync-to-gitlab:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Push to GitLab
      env:
        GITLAB_PAT: ${{ secrets.GITLAB_PAT }}
      run: |
        # Add GitLab remote
        git remote add gitlab https://oauth2:$GITLAB_PAT@gitlab.presidio.com/amridha/glueetlutils.git
        # Fetch latest changes from GitLab to avoid conflicts
        git fetch gitlab main || true
        # Force push changes to GitLab, overwriting conflicts
        git push --force gitlab main
