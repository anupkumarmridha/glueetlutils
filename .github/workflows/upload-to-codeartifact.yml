name: Build and Upload to AWS CodeArtifact

on:
  push:
    branches:
      - main

jobs:
  build-and-upload:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.8'

    - name: Debug setup.py
      run: cat setup.py

    - name: Install Dependencies
      run: |
        pip install setuptools wheel twine boto3

    - name: Check Version Change
      id: version-check
      run: |
        bash .github/scripts/check_version.sh

    - name: Exit if No Version Change
      if: env.version_changed == 'false'
      run: exit 0

    - name: Build the Package
      if: env.version_changed == 'true'
      run: |
        bash .github/scripts/build_package.sh

    - name: Configure AWS Credentials
      if: env.version_changed == 'true'
      uses: aws-actions/configure-aws-credentials@v3
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
        aws-region: us-east-1

    - name: Authenticate with AWS CodeArtifact
      if: env.version_changed == 'true'
      run: |
        bash .github/scripts/authenticate_codeartifact.sh

    - name: Upload to AWS CodeArtifact
      if: env.version_changed == 'true'
      run: |
        bash .github/scripts/upload_to_codeartifact.sh
